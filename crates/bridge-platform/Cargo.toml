[package]
name = "bridge-platform"
description = "OS integration: screen capture, input injection, native dialogs (Windows in MVP)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
] }
# User-mode client for the ViGEmBus virtual gamepad driver (driver installed separately by the user).
vigem-client.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# "highsierra" exposes CGEventCreateScrollWheelEvent2 (macOS 10.13+; we target 11+)
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "xfixes"] }
