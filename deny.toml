# cargo-deny policy — see docs/07 - ADR/ADR-006 (licence compatibility with AGPL-3.0)
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0",
  "OpenSSL", "AGPL-3.0-or-later", "GPL-3.0-or-later", "LGPL-3.0-or-later",
  # jpeg-encoder: FSF Free/Libre, GPL-compatible
  "IJG",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path inside the workspace (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
