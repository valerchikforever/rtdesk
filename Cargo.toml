[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"
repository = "https://example.invalid/bridge"
publish = false

[workspace.dependencies]
bridge-proto = { path = "crates/bridge-proto" }
bridge-crypto = { path = "crates/bridge-crypto" }
bridge-session = { path = "crates/bridge-session" }
bridge-codec = { path = "crates/bridge-codec" }
bridge-net = { path = "crates/bridge-net" }
bridge-platform = { path = "crates/bridge-platform" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
ring = "0.17"
x509-parser = "0.16"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
zune-core = "0.4"
# No "wayland-csd-adwaita": it pulls the unmaintained ttf-parser (RUSTSEC-2026-0192).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = "0.4"
arboard = "3"
windows = "0.58"
vigem-client = "0.1"
gilrs = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Image codecs are unusably slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 3
