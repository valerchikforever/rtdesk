name: Release

# Push a tag like v0.2.0 to build binaries and create a DRAFT release.
# A maintainer reviews the draft (checksums, notes) before publishing it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # build provenance (SLSA) attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: host (the PC being accessed) + viewer + servers
          - name: windows-x64
            os: windows-latest
            bins: bridge-host bridge-viewer bridge-rendezvous bridge-relay
          # macOS: host + viewer + servers, universal binary (Apple Silicon + Intel)
          - name: macos-universal
            os: macos-latest
            bins: bridge-host bridge-viewer bridge-rendezvous bridge-relay
          # Linux: host (X11) + viewer + servers; built on 22.04 for compatibility with older glibc (Debian 12+, Ubuntu 22.04+)
          - name: linux-x64
            os: ubuntu-22.04
            bins: bridge-host bridge-viewer bridge-rendezvous bridge-relay
          # Linux ARM64: e.g. a Raspberry Pi 4/5 as a self-hosted server
          - name: linux-arm64
            os: ubuntu-22.04-arm
            bins: bridge-host bridge-viewer bridge-rendezvous bridge-relay
    env:
      PKG: bridge-${{ github.ref_name }}-${{ matrix.name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # No build cache on purpose: release builds start clean.
      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --locked $(printf -- '-p %s ' ${{ matrix.bins }})
      - name: Build universal binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          args=$(printf -- '-p %s ' ${{ matrix.bins }})
          cargo build --release --locked --target aarch64-apple-darwin $args
          cargo build --release --locked --target x86_64-apple-darwin $args
          mkdir -p target/release
          for b in ${{ matrix.bins }}; do
            lipo -create -output "target/release/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            codesign --force --sign - "target/release/$b"   # ad-hoc signature (not notarized)
            lipo -info "target/release/$b"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "pkg/$env:PKG", dist | Out-Null
          foreach ($b in "${{ matrix.bins }}".Split(" ")) { Copy-Item "target/release/$b.exe" "pkg/$env:PKG/" }
          Copy-Item LICENSE, README.md, SECURITY.md "pkg/$env:PKG/"
          Compress-Archive -Path "pkg/$env:PKG/*" -DestinationPath "dist/$env:PKG.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "pkg/$PKG" dist
          for b in ${{ matrix.bins }}; do cp "target/release/$b" "pkg/$PKG/"; done
          cp LICENSE README.md SECURITY.md "pkg/$PKG/"
          ditto -c -k --keepParent "pkg/$PKG" "dist/$PKG.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "pkg/$PKG" dist
          for b in ${{ matrix.bins }}; do cp "target/release/$b" "pkg/$PKG/"; done
          cp LICENSE README.md SECURITY.md "pkg/$PKG/"
          tar -C pkg -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            Bridge is free and open-source software (AGPL-3.0).

            | Download | Contains |
            |---|---|
            | `windows-x64.zip` | host, viewer, servers (gamepads need ViGEmBus) |
            | `macos-universal.zip` | host, viewer, servers (Apple Silicon + Intel, macOS 11+) |
            | `linux-x64.tar.gz` / `linux-arm64.tar.gz` | host (X11 sessions; needs zenity or kdialog), viewer, servers |

            **macOS/Linux hosts are new and experimental.** macOS host needs Screen Recording + Accessibility permissions.
            Linux host: Xorg sessions only (no Wayland yet). Gamepad forwarding to macOS/Linux hosts is not available yet.

            **Verify your download:** compare with `SHA256SUMS`, and check build provenance with
            `gh attestation verify <file> --repo ${{ github.repository }}`.

            Binaries are not yet code-signed/notarized:
            - Windows: SmartScreen may warn ("More info" → "Run anyway").
            - macOS: run `xattr -dr com.apple.quarantine <folder>` once after unpacking.
